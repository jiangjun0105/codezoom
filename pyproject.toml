[tool.black]
line-length = 85
target-version = ['py310']

[tool.flake8]
max-line-length = 85
extend-ignore = ["D203", "E203", "E251", "E266", "E302", "E305", "E401", "E402", "E501", "F401", "F403", "W503"]
exclude = [".git", "__pycache__", "dist"]
max-complexity = 10

[tool.isort]
atomic = true
profile = "black"
line_length = 85
skip_gitignore = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.poetry]
name = "ichigen-coder"
version = "0.0.2"
description = "Ichigen Coder is an assembly of AI bots, driven by Large Language Model technology, designed to augment the capabilities of human developers, simplifying the coding process and boosting efficiency in software development"
authors = ["Jun Jiang <jiangjun0105@gmail.com>"]
readme = "README.md"
packages = [{include = "codebase_analyzer"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain = ">=0.0.206"
click = ">=8.1.3"
loguru = "^0.5.3"
numpy = "^1.21.2"
pandas = "^1.3.3"
openai = "^0.27.0"
pyyaml = "^5.4.1"
python-dotenv = "^0.19.0"
pydantic = "^1.10.9"
singleton_decorator = "^1.0.0"
tiktoken = ">=0.3.3"

[tool.poetry.dev-dependencies]
pytest = "^7.3.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
